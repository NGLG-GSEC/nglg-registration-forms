# Render Blueprint for the standalone Greek dinner-registration app.
# Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: nglg-greek-dinner
    runtime: node
    rootDir: apps/greek-dinner-web
    region: frankfurt
    # A persistent disk is required for the database, and disks need a paid plan.
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: registrations-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_FILE
        value: /var/data/registrations.db
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Εθνική Μεγάλη Στοά της Ελλάδος
      - key: ORGANIZER_EMAIL
        sync: false
      - key: MAIL_BCC
        sync: false
